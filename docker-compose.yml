# ollarc-intel: Ollama (Intel GPU / SYCL) + Open WebUI
#
#   docker compose up -d
#   docker compose exec ollama ollama pull gemma4:e4b
#   -> http://<host>:3000
#
# Local settings belong in .env (not in this file), e.g.:
#   RENDER_GID=993  OLLARC_TAG=latest-arl-h  OLLAMA_CONTEXT_LENGTH=32768
#
# Registry: GHCR by default; the same images are on Docker Hub (OLLARC_IMAGE=dosperado74/ollarc-intel).
# Image tags (set OLLARC_TAG in .env): latest, or a pinned Ollama version such as 0.40.14.
# latest runs on every Intel GPU (Meteor/Arrow/Lunar Lake, Arc A/B). Optional precompiled
# kernels: latest-arl-h (Arrow Lake-H iGPU), latest-dg2 (Arc A-series), latest-bmg (Arc B-series).
# Dedicated Arc card next to an iGPU: see docs/arc-dgpu.md (ONEAPI_DEVICE_SELECTOR).

services:
  ollama:
    image: ${OLLARC_IMAGE:-ghcr.io/dosperado74/ollarc-intel}:${OLLARC_TAG:-latest}
    container_name: ollama
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      # numeric GID of the "render" group on the host: getent group render | cut -d: -f3
      - "${RENDER_GID:-993}"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
      # optional tuning, see docs/tuning.md:
      # - OLLAMA_FLASH_ATTENTION=1
      # - OLLAMA_KV_CACHE_TYPE=q8_0
      # - GGML_SYCL_DYNAMIC_PRECISION=BF16   # if a model produces garbage/NaN with F16

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true
    volumes:
      - open-webui:/app/backend/data

volumes:
  ollama:
  open-webui:
