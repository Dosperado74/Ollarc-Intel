name: build

# Builds ghcr.io/<owner>/ollarc-intel for the newest upstream Ollama release.
# - daily: only if no image exists yet for the newest upstream tag
# - push to main / manual: always (manual run can pin a version)
# Optional Docker Hub mirror: set the repository secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (Docker Hub personal access token, Read & Write; Read, Write & Delete
# also lets CI update the Docker Hub overview). Without them the mirror is skipped.

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "patches/**"
      - "UPSTREAM_VERSION"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      ollama_version:
        description: "Upstream tag (e.g. v0.40.14); empty = latest release"
        required: false
      force:
        description: "Rebuild even if the image already exists"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ollarc-intel

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ inputs.ollama_version }}"
          if [ -z "$version" ]; then
            version=$(gh api repos/ollama/ollama/releases/latest --jq .tag_name)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          image="${IMAGE,,}"
          build=true
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "true" ]; }; then
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
            if docker manifest inspect "$image:${version#v}" >/dev/null 2>&1; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "upstream=$version build=$build" | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # JIT kernels: every Intel GPU
          - arch: ""
            suffixes: ""
            cache: "ollarc"
          # AOT kernels for Arrow Lake-H with the >4 GB buffer fix (verified on an Arc 140T)
          - arch: "arl-h"
            suffixes: "-arl-h"
            cache: "ollarcarl-h"
          # AOT kernels for dedicated Arc A-series cards: ACM-G10 (A770/A750/A580), ACM-G11 (A380/A310)
          - arch: "acm-g10,acm-g11"
            suffixes: "-dg2"
            cache: "ollarc-dg2"
          # AOT kernels for dedicated Arc B-series cards: BMG-G21 (B580/B570, Arc Pro B50/B60)
          - arch: "bmg-g21"
            suffixes: "-bmg"
            cache: "ollarc-bmg"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: tags
        run: |
          v="${{ needs.resolve.outputs.version }}"; v="${v#v}"
          image="${IMAGE,,}"
          tags=""
          IFS=',' read -ra sfx <<< "${{ matrix.suffixes }}"
          [ ${#sfx[@]} -gt 0 ] || sfx=("")
          for s in "${sfx[@]}"; do tags="$tags,$image:$v$s,$image:latest$s"; done
          echo "tags=${tags#,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            OLLAMA_VERSION=${{ needs.resolve.outputs.version }}
            SYCL_DEVICE_ARCH=${{ matrix.arch }}
          tags: ${{ steps.tags.outputs.tags }}
          # explicit scope: matrix.arch may contain commas, which would break the cache spec
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

  # Copies the finished GHCR images 1:1 to Docker Hub (no second build). Runs daily even
  # when nothing was built, so tags missing on Docker Hub are filled in and the overview stays current.
  dockerhub:
    needs: [resolve, image]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Docker Hub not configured
        if: env.DOCKERHUB_USERNAME == ''
        run: echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set, skipping the Docker Hub mirror" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: env.DOCKERHUB_USERNAME != ''
      - uses: docker/setup-buildx-action@v4
        if: env.DOCKERHUB_USERNAME != ''
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror images
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          set -euo pipefail
          v="${{ needs.resolve.outputs.version }}"; v="${v#v}"
          src="${IMAGE,,}"
          dst="docker.io/${DOCKERHUB_USERNAME,,}/ollarc-intel"
          # same suffixes as the image matrix
          for s in "" -arl-h -dg2 -bmg; do
            if ! docker buildx imagetools inspect "$src:$v$s" >/dev/null 2>&1; then
              echo "::warning::$src:$v$s does not exist (build failed?), not mirrored"
              continue
            fi
            # fresh build: always copy; otherwise only fill in missing tags
            if [ "${{ needs.resolve.outputs.build }}" != "true" ] \
               && docker buildx imagetools inspect "$dst:$v$s" >/dev/null 2>&1; then
              echo "$dst:$v$s already up to date"
              continue
            fi
            docker buildx imagetools create -t "$dst:$v$s" -t "$dst:latest$s" "$src:$v$s"
            echo "mirrored $src:$v$s -> $dst:$v$s, $dst:latest$s" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Render Docker Hub overview
        if: env.DOCKERHUB_USERNAME != ''
        run: sed "s#{{IMAGE}}#${DOCKERHUB_USERNAME,,}/ollarc-intel#g" docs/dockerhub.md > dockerhub-readme.md
      # needs a token with Read, Write & Delete; with Read & Write only this step fails harmlessly
      - uses: peter-evans/dockerhub-description@v5
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/ollarc-intel
          short-description: "Upstream Ollama accelerated on Intel Arc / Xe GPUs (iGPU + dGPU) via llama.cpp SYCL"
          readme-filepath: ./dockerhub-readme.md

  release:
    needs: [resolve, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bump UPSTREAM_VERSION
        run: |
          v="${{ needs.resolve.outputs.version }}"
          if [ "$(cat UPSTREAM_VERSION)" != "$v" ]; then
            echo "$v" > UPSTREAM_VERSION
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: track upstream Ollama $v"
            git push
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          v="${{ needs.resolve.outputs.version }}"
          image="${IMAGE,,}"
          pull() { printf 'docker pull %-48s # %s\n' "$image:${v#v}$1" "$2"; }
          {
            echo "Upstream: https://github.com/ollama/ollama/releases/tag/$v"
            echo
            echo '```'
            pull ""       "JIT, every Intel GPU (recommended)"
            pull "-arl-h" "Arrow Lake-H iGPU (Core Ultra 200H, Arc 140T / 130T)"
            pull "-dg2"   "dedicated Arc A-series (A770, A750, A580, A380, A310)"
            pull "-bmg"   "dedicated Arc B-series (B580, B570, Arc Pro B50 / B60)"
            echo '```'
            echo
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "Also on Docker Hub (same images): \`docker.io/${DOCKERHUB_USERNAME,,}/ollarc-intel\` with the same tags."
            fi
            echo
            echo "The same tags without the version (\`latest\`, \`latest-arl-h\`, \`latest-dg2\`, \`latest-bmg\`) always point to the newest build."
            echo "Dedicated Arc cards: [docs/arc-dgpu.md](https://github.com/${{ github.repository }}/blob/main/docs/arc-dgpu.md) · Share your numbers: [benchmark form](https://github.com/${{ github.repository }}/issues/new?template=benchmark.yml)"
          } > notes.md
          # existing release (e.g. a rebuild after new image variants): refresh its notes
          if gh release view "$v" >/dev/null 2>&1; then
            gh release edit "$v" --notes-file notes.md
          else
            gh release create "$v" --title "ollarc-intel $v" --notes-file notes.md
          fi

  report-failure:
    needs: [resolve, image]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.resolve.outputs.version }}"
          title="Build failed for upstream Ollama $v"
          gh issue list -R "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q . && exit 0
          gh issue create -R "${{ github.repository }}" --title "$title" \
            --body "The scheduled build for $v failed (patches may no longer apply). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
