name: build

# Builds ghcr.io/<owner>/ollarc-intel for the newest upstream Ollama release.
# - daily: only if no image exists yet for the newest upstream tag
# - push to main / manual: always (manual run can pin a version)

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "patches/**"
      - "UPSTREAM_VERSION"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      ollama_version:
        description: "Upstream tag (e.g. v0.40.14); empty = latest release"
        required: false
      force:
        description: "Rebuild even if the image already exists"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ollarc-intel

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ inputs.ollama_version }}"
          if [ -z "$version" ]; then
            version=$(gh api repos/ollama/ollama/releases/latest --jq .tag_name)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          image="${IMAGE,,}"
          build=true
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "true" ]; }; then
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
            if docker manifest inspect "$image:${version#v}" >/dev/null 2>&1; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "upstream=$version build=$build" | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: tags
        run: |
          v="${{ needs.resolve.outputs.version }}"; v="${v#v}"
          image="${IMAGE,,}"
          # -arl-h tags used to be AOT builds, which break models > 4 GB; keep them as aliases
          echo "tags=$image:$v,$image:latest,$image:$v-arl-h,$image:latest-arl-h" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            OLLAMA_VERSION=${{ needs.resolve.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=ollarc
          cache-to: type=gha,mode=max,scope=ollarc

  release:
    needs: [resolve, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump UPSTREAM_VERSION
        run: |
          v="${{ needs.resolve.outputs.version }}"
          if [ "$(cat UPSTREAM_VERSION)" != "$v" ]; then
            echo "$v" > UPSTREAM_VERSION
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: track upstream Ollama $v"
            git push
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.resolve.outputs.version }}"
          image="${IMAGE,,}"
          gh release view "$v" >/dev/null 2>&1 && exit 0
          gh release create "$v" --title "ollarc-intel $v" --notes "Upstream: https://github.com/ollama/ollama/releases/tag/$v

          \`\`\`
          docker pull $image:${v#v}
          \`\`\`"

  report-failure:
    needs: [resolve, image]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.resolve.outputs.version }}"
          title="Build failed for upstream Ollama $v"
          gh issue list -R "${{ github.repository }}" --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q . && exit 0
          gh issue create -R "${{ github.repository }}" --title "$title" \
            --body "The scheduled build for $v failed (patches may no longer apply). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
